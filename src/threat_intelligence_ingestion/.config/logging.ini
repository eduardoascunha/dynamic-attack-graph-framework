[loggers]
keys=root,threat_intelligence_connector

[handlers]
keys=consoleHandler

[formatters]
keys=debugFormatter

[logger_root]
level=DEBUG
handlers=consoleHandler

[logger_threat_intelligence_connector]
level=DEBUG
handlers=consoleHandler
qualname=threat_intelligence_connector
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=debugFormatter
args=(sys.stdout,)

[formatter_debugFormatter]
format=%(asctime)s - %(levelname)-2s - [%(filename)s:%(lineno)d] - %(message)s