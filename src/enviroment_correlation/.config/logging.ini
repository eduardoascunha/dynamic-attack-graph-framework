[loggers]
keys=root,environment_correlation

[handlers]
keys=consoleHandler

[formatters]
keys=debugFormatter

[logger_root]
level=DEBUG
handlers=consoleHandler

[logger_environment_correlation]
level=DEBUG
handlers=consoleHandler
qualname=environment_correlation
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=debugFormatter
args=(sys.stdout,)

[formatter_debugFormatter]
format=%(asctime)s - %(levelname)-2s - [%(filename)s:%(lineno)d] - %(message)s