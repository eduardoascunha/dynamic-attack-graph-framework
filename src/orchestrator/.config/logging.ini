[loggers]
keys=root,orchestrator_service

[handlers]
keys=consoleHandler

[formatters]
keys=debugFormatter

[logger_root]
level=DEBUG
handlers=consoleHandler

[logger_orchestrator_service]
level=DEBUG
handlers=consoleHandler
qualname=orchestrator_service
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=debugFormatter
args=(sys.stdout,)

[formatter_debugFormatter]
format=%(asctime)s - %(levelname)-2s - [%(filename)s:%(lineno)d] - %(message)s