[loggers]
keys=root,post_processing_layer

[handlers]
keys=consoleHandler

[formatters]
keys=debugFormatter

[logger_root]
level=DEBUG
handlers=consoleHandler

[logger_post_processing_layer]
level=DEBUG
handlers=consoleHandler
qualname=post_processing_layer
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=debugFormatter
args=(sys.stdout,)

[formatter_debugFormatter]
format=%(asctime)s - %(levelname)-2s - [%(filename)s:%(lineno)d] - %(message)s